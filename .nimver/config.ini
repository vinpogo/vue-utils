; nimver configuration
; see https://github.com/vinpogo/nimver for details

; How to treat a type that is not listed below. `reject` refuses the commit;
; any bump level accepts it and counts it at that level.
; [commits]
; unknownType = reject

; Packages are versioned independently, each with its own tag
; (`@vingy/vueltip-v2.4.0`) and its own CHANGELOG.md next to its manifest.
; `packages/shared` and `demo/` are deliberately not declared: files with no
; owning manifest count as shared changes and, with `sharedChanges = all`,
; affect every package here. That is what keeps vueltip republished when the
; shared types it inlines change.
[workspace]
strategy = independent
sharedChanges = all

[package.@vingy/vueltip]
manifest = packages/vueltip/package.json

[package.@vingy/vuebugger]
manifest = packages/vuebugger/package.json

[package.demo]
manifest = demo/package.json

[types]
feat = minor
fix = patch
perf = patch
refactor = patch
revert = patch
docs = none
style = none
chore = none
test = none
build = none
ci = none
version = ignore
wip = ignore
