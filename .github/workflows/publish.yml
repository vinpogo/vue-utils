on:
  push:
    tags:
      # nimver writes `@vingy/<package>-v<version>`. A bare `*` would not match:
      # GitHub Actions patterns treat it as "any character except `/`".
      - '@vingy/*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: mise run install --frozen-lockfile

      # Publishes every workspace package whose version is not on the registry
      # yet, so a tag for one package is a no-op for the other.
      - name: Publish to npm
        # `pnpm run`, not `pnpm publish`: the latter resolves to pnpm's built-in
        # publish command and would try to publish the workspace root.
        run: pnpm run publish
